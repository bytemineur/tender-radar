json_fields:
  title: ggName
  # 发布时间（毫秒戳）。parse_list_json 的 _normalize_ms_timestamp 会转日期串。
  publish_time: ggStartTime
  # 采购人（招标人）
  purchaser: zbrName
  # 截止时间（毫秒戳）
  deadline: jieZhiTime
  # 项目编号。注意 Tender 模型目前没有存编号的字段，抓到也不落库
  # （与 chinapost 的 code 同理），留着是将来加字段时直接可用。
  code: xmBH
  # 只为拼详情页链接
  gguid: ggGuid

# 列表接口不给详情 URL，按站点自己的 SPA 路由拼。
url_template: "https://dzzb.ciesco.com.cn/zsj-portal/ggDetail?ggGuid={gguid}"

default_keyword: 法律
keywords:
  - 法律
  - 法律顾问
  - 律师
  - 诉讼
  - 纠纷
  - 仲裁
# 「合规」126 条但全是 IT 合规系统类，不收；
# 「法律服务」309 条与「法律」高度重叠，重复收只会多一倍请求。

delay:
  min: 1.5
  max: 3.0

pagination:
  type: page_param
  param: pageNum
  page_size: 15
  # 倒序，每页约跨 2 个月，3 页 ≈ 半年。配每 4 小时一轮足够。
  max_pages: 3

# 详情页是 Nuxt 壳，正文要另一个同样带签名的接口才拿得到，
# 而列表字段（采购人 / 截止 / 编号）已经够用，所以不抓详情。
fetch_detail: false

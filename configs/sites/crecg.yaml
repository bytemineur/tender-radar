# 中国中铁采购电子商务平台（crecg.toobiao.com）—— 已实测可用
#
# 【实测结论 2026-10-24】
#   · ⚠️ 先说清楚它是什么：页面底部自己写着
#       「本页面非中国中铁采购电子商务平台官网，本页面是电力招标网
#         （dlzb.com）按招标信息关键词归类汇总的结果」。
#     即 **第三方聚合站**，不是中铁官方。数据能反映中铁系（中铁一到十局、
#     中铁建工、中铁建设、中铁物资…）的招标动态，但时效与完整性取决于
#     聚合方，不要当官方口径用。
#   · 好在技术门槛极低：Destoon CMS 静态页，**纯 HTTP GET 就行**，
#     不用登录、不用 cookie、不用浏览器、没有任何反爬（连 UA 都不挑）。
#     这是目前所有源里最好接的一个。
#   · 列表页字段极简：只有标题 + 发布日期 + 详情链接，没有采购人、
#     没有预算、没有截止时间。所以本源**不取详情**，见下面的说明。
#   · **没有站内搜索**。页面上的搜索框 form action 指向总站
#     https://www.dlzb.com/search/，本站的 /search/、/search.php 全是
#     404 或 403。所以只能拉全量分页 + local_filter 本地筛标题，
#     跟 gdggzy 一个路子。
#   · 分页是 Destoon 的 /zhaobiao/page-{n}.shtml（1 基，共 500 页）。
#     page-1.shtml 会 301 回栏目页 /zhaobiao/，fetcher 开了
#     follow_redirects，所以 URL 里统一写 page-{page}.shtml 即可，不用特判第 1 页。
#   · 每页 20 条，**按发布日期倒序**。实测 20 页 = 400 条只覆盖 2 天，
#     即发布量约 200 条/天 —— 中铁系的量非常大，但法律类极少
#     （400 条里只筛出 1 条「工程造价纠纷调解咨询服务」，命中率 ~0.25%）。
#     按 200 条/天算，一条新公告在「前 10 页」窗口里能停留约 1.2 天，
#     配合每 3 小时一轮足够覆盖，不会漏。
#   · **详情页抓不到**：列表链接指向 www.dlzb.com/d-zb-*.html，
#     那边挂了阿里云 WAF + 滑块验证码（浏览器过去也是「请按住滑块拖动到最右边」）。
#     所以 fetch_detail 关掉，只存列表字段，链接保留给用户自己点开看。
#     别再花时间试详情页了，过不去。
#
# 与其他源的分工：cmcc / csg / sgcc 覆盖了通信与电网三家央企，
# 这个源补上**基建施工类央企**（中国中铁各工程局）。它们常年有
# 「工程纠纷调解、造价咨询、法律顾问」这类服务采购，只是混在海量
# 物资采购里，得靠本地过滤捞。

id: crecg
name: 中国中铁采购电子商务平台
base_url: http://crecg.toobiao.com
enabled: true
mode: http
version: "1.0.0"
schedule: "55 */3 * * *"

# 第 1 页 page-1.shtml 会 301 到栏目页，跟随重定向后正常。
# 只盯 /zhaobiao/（招标公告）。另几个栏目：/gongcheng/ 工程、
# /xunjia/ 询价、/zhongbiao/ 中标结果（已成交，没有可投价值）、
# /huowu/ 设备（更新很慢，实测首页还停在 7 月），都不如招标栏目。
search_url: "http://crecg.toobiao.com/zhaobiao/page-{page}.shtml"

response_type: html

list_container: "div.main-l div.pdbox ul li"

list_fields:
  title:
    selectors: ["a"]
    extract: text
  url:
    selectors: ["a"]
    extract: "attr:href"
  publish_time:
    selectors: ["span.fr"]
    extract: text
    regex: "\\d{4}-\\d{1,2}-\\d{1,2}"

# 只留招标公告。栏目页（第 1 页）比内页多挂一块「结果公示」，
# 混在同一个 ul 里——实测第 1 页 24 行里有 8 行是它。这类公告已经成交，
# 没有可投价值，好在链接形态不同：招标公告是 d-zb-*.html，
# 结果公示是 d-zhongbiao-*.html（注意后者不含「d-zb-」，不会误匹配）。
# 第 2 页起本来就只有招标公告，加了也无害。
# （这里不能用 drop_if——它只在 JSON 解析路径生效，HTML 路径要用 url_filter。）
url_filter: "d-zb-\\d+\\.html"

# 站端不支持关键词检索 → 拉列表后本地过滤
local_filter: true
default_keyword: 法律
keywords:
  - 法律
  - 法律顾问
  - 法律服务
  - 诉讼
  - 律师
  - 法务
  - 纠纷
  - 仲裁
# 刻意不收「合规」：中铁系标题里出现的合规多是「合规性检查」这类
# 工程管理用语，加进来只会把施工项目错判成法律服务。

delay:
  min: 1.5
  max: 3.0

pagination:
  type: page_param
  param: page
  page_size: 20
  # 10 页 = 200 条 ≈ 1 天的发布量。配每 3 小时一轮，窗口重叠度高，
  # 新发布的法律类公告不会漏。再深只是白费请求——实测法律类命中率仅 0.25%。
  max_pages: 10

# 详情页在 www.dlzb.com，阿里云 WAF + 滑块验证码，HTTP 与浏览器都过不去。
# 开着只会每轮多打几十次必定失败的请求，所以明确关掉。
fetch_detail: false
fetch_detail_default: false

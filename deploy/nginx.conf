# 招标雷达 — Nginx 反向代理
#
# 用法：
#   1) 把下面两处 tender.example.com 换成你自己的域名（共 4 处：2 个 server_name + 2 行证书路径）
#   2) 存为 /etc/nginx/conf.d/tender-radar.conf
#   3) nginx -t  &&  systemctl reload nginx
#
# 注意：证书行在第一次签发前是不存在的，直接 nginx -t 会报
#   "cannot load certificate ... No such file or directory"。
# 正确顺序是：先只用 80 端口那段配置 → 签发证书 → 再把 443 那段加进来。
# 用 `certbot --nginx` 的话它会自动改配置，可以忽略这条。

upstream tender_radar {
    server 127.0.0.1:8000;
    keepalive 8;
}

# ── HTTP：ACME 校验放行，其余全部跳 HTTPS ─────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name tender.example.com;

    # Certbot webroot 方式续期时的校验目录
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS：反代到本机 uvicorn ─────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # nginx ≥ 1.25.1 用这一行开 HTTP/2；
    # 更老的版本删掉它，改成 listen 443 ssl http2;
    http2 on;
    server_name tender.example.com;

    ssl_certificate     /etc/letsencrypt/live/tender.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tender.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # 确认站点在 HTTPS 下完全正常后再打开（打开后浏览器会强制走 HTTPS，短期内改不回来）
    # add_header Strict-Transport-Security "max-age=31536000" always;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 2m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 静态资源短缓存 + 过期后回源校验，改完 CSS/JS 刷新即可生效
    location ~* \.(?:css|js)$ {
        proxy_pass http://tender_radar;
        proxy_set_header Host $host;
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    location / {
        proxy_pass http://tender_radar;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # 「抓取」和「导出 CSV」是长任务，默认 60s 会被 Nginx 掐断成 504。
        # 一轮全量采集按源数量可能要几分钟，所以放宽到 10 分钟。
        proxy_connect_timeout 30s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
    }

    # 接口与埋点不缓存
    location /api/ {
        proxy_pass http://tender_radar;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_read_timeout 600s;
        add_header Cache-Control "no-store" always;
    }
}
